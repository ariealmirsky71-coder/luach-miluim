        .req-card.on{ border-color:var(--pri); box-shadow:0 0 0 3px rgba(47,82,51,.1); }
        .rc-top{ display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:4px; }
        .rc-name{ font-weight:700; font-size:13.5px; } .rc-dates{ font-size:12px; margin-bottom:3px; }
        .progress{ height:5px; background:var(--line); border-radius:3px; overflow:hidden; margin:5px 0 3px; }
        .progress span{ display:block; height:100%; background:var(--pri); }

        .card-head{ display:flex; justify-content:space-between; align-items:center; width:100%; background:none; border:none; padding:0; text-align:right; gap:10px; }
        .ch-title{ font-weight:700; font-size:14px; }
        .card-body{ margin-top:14px; border-top:1px solid var(--line); padding-top:14px; }
        .rot{ transform:rotate(-90deg); }

        .day-card{ border:1px solid var(--line); border-radius:12px; padding:12px; background:#fff; }
        .day-card-head{ display:flex; justify-content:space-between; align-items:center; width:100%;
          background:none; border:none; padding:0; text-align:right; gap:10px; }
        a.btn-sec, a.btn-ghost{ text-decoration:none; }
        .assign-slot{ border:1px solid var(--line); border-inline-start:4px solid; border-radius:10px; padding:10px; background:#fff; }
        .as-head{ display:flex; justify-content:space-between; gap:8px; flex-wrap:wrap; align-items:center; }
        .as-info{ display:flex; gap:9px; flex-wrap:wrap; align-items:center; font-size:12px; }
        .as-actions{ margin-top:8px; }
        .sub-tag{ display:inline-flex; align-items:center; gap:4px; background:rgba(47,82,51,.1); color:var(--pri-d);
          border-radius:999px; padding:3px 10px; font-size:11.5px; font-weight:700; }
        .cand-list{ margin-top:10px; border-top:1px dashed var(--line); padding-top:9px; display:flex; flex-direction:column; gap:6px; }
        .cand{ display:flex; justify-content:space-between; align-items:center; gap:10px; padding:8px 10px; border-radius:9px; background:var(--paper); flex-wrap:wrap; }
        .cand.blocked{ opacity:.55; }
        .cand-name{ font-weight:700; font-size:12.5px; }
        .cand-tags{ display:flex; gap:5px; flex-wrap:wrap; margin-top:4px; }
        .tag{ font-size:10px; padding:2px 8px; border-radius:999px; background:#fff; border:1px solid var(--line); color:var(--muted); display:inline-flex; align-items:center; gap:3px; }
        .tag.good{ border-color:var(--pri); color:var(--pri); } .tag.bad{ border-color:var(--red); color:var(--red); font-weight:700; }

        .msg-box{ background:var(--paper); border-inline-start:4px solid var(--pri); border-radius:9px; padding:11px 13px; font-size:13.5px; line-height:1.6; margin-bottom:12px; }
        .note-box{ display:flex; gap:7px; align-items:flex-start; background:rgba(47,92,138,.08); color:var(--blue); border-radius:9px; padding:9px 11px; font-size:12px; margin:10px 0; }
        .warn-box{ display:flex; gap:7px; align-items:flex-start; background:rgba(201,138,46,.12); color:#8A5E14; border-radius:9px; padding:9px 11px; font-size:12px; margin:8px 0; }
        .ok-tag{ display:inline-flex; align-items:center; gap:4px; color:var(--pri); font-weight:700; font-size:11.5px; }
        .warn-tag{ display:inline-flex; align-items:center; gap:4px; color:var(--amber); font-weight:700; font-size:11px; }
        .file-name{ display:inline-flex; align-items:center; gap:4px; font-size:12px; color:var(--muted); }
        .file-link{ display:inline-flex; align-items:center; gap:4px; font-size:12px; font-weight:700; color:var(--blue);
          background:none; border:none; padding:0; text-decoration:underline; cursor:pointer; }
        .file-link.xs{ font-size:11px; }
        .file-chip{ display:inline-flex; align-items:center; gap:5px; font-size:12px; color:var(--ink);
          background:var(--paper); border:1px solid var(--line); border-radius:999px; padding:4px 10px; }
        .file-chip button{ background:none; border:none; padding:0; display:inline-flex; color:var(--red); cursor:pointer; }

        .timeline{ margin-top:14px; border-top:1px solid var(--line); padding-top:12px; display:flex; flex-direction:column; gap:9px; }
        .tl-row{ display:flex; gap:9px; align-items:flex-start; font-size:12.5px; }
        .tl-dot{ width:8px; height:8px; border-radius:50%; background:var(--pri); margin-top:6px; flex-shrink:0; }

        .search-row{ display:flex; align-items:center; gap:7px; background:#fff; border:1.5px solid var(--line);
          border-radius:9px; padding:0 10px; margin-bottom:10px; color:var(--muted); }
        .search-row input{ border:none; margin:0; padding:9px 0; }
        .filters{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin-bottom:6px; }
        .filters .lbl{ margin-top:0; }

        .bars{ display:flex; flex-direction:column; gap:8px; }
        .bar-row{ display:flex; align-items:center; gap:10px; font-size:12.5px; }
        .bar-name{ min-width:100px; font-weight:600; }
        .bar-track{ flex:1; height:12px; background:var(--paper); border-radius:6px; overflow:hidden; border:1px solid var(--line); }
        .bar-fill{ display:block; height:100%; background:var(--pri); }
        .bar-val{ font-weight:800; color:var(--pri-d); min-width:22px; }

        .empty-state{ display:flex; align-items:center; gap:10px; color:var(--muted); font-size:13px; }

        .toasts{ position:fixed; bottom:16px; inset-inline-start:16px; display:flex; flex-direction:column; gap:8px; z-index:60; }
        .toast{ background:var(--pri-d); color:#fff; padding:10px 15px; border-radius:10px; font-size:12.5px;
          display:flex; align-items:center; gap:7px; box-shadow:0 6px 18px rgba(0,0,0,.2); animation:in .22s ease; max-width:330px; }
        @keyframes in{ from{ opacity:0; transform:translateY(8px);} to{ opacity:1; transform:none;} }

        @media (max-width:640px){
          .app{ padding:10px; -webkit-text-size-adjust:100%; }
          /* גודל 16px מונע מהאייפון לזום אוטומטית בכל לחיצה על שדה */
          input, select, textarea{ font-size:16px; padding:10px; }
          .mini-input{ font-size:15px; padding:7px; }

          header.top{ padding-bottom:12px; margin-bottom:14px; gap:10px; }
          .brand h1{ font-size:20px; }
          .brand p{ font-size:11px; }
          .emblem{ width:36px; height:36px; }
          header.top .row.gap{ width:100%; justify-content:space-between; }

          .roles{ width:100%; order:3; overflow-x:auto; flex-wrap:nowrap; -webkit-overflow-scrolling:touch; }
          .roles button{ white-space:nowrap; padding:9px 12px; }
          .user-chip{ font-size:11.5px; padding:5px 9px; }

          .subtabs{ width:100%; }
          .subtabs button{ flex:1; justify-content:center; padding:10px 8px; }

          .sec-title{ font-size:15.5px; }
          .paper-card{ padding:14px; border-radius:12px; }

          /* מטרות מגע נוחות לאצבע */
          .btn-pri, .btn-sec, .btn-info, .btn-danger, .btn-ghost{ min-height:42px; }
          .xs-btn{ min-height:34px; }
          .chip{ min-height:36px; }

          .kpi{ min-width:calc(50% - 4px); padding:9px 10px; }
          .kpi strong{ font-size:19px; }
          .kpi span{ font-size:10.5px; }

          .d-row{ flex-direction:column; gap:2px; }
          .d-key{ min-width:auto; }

          .slot-line{ gap:6px; font-size:11.5px; padding:7px 9px; }
          .sl-right{ margin-inline-start:0; width:100%; }
          .as-info{ gap:6px; font-size:11.5px; }
          .cand{ flex-direction:column; align-items:stretch; }
          .cand .btn-pri{ width:100%; justify-content:center; }

          .bell-panel{ width:calc(100vw - 20px); inset-inline-end:auto; inset-inline-start:-10px; }
          .toasts{ inset-inline:10px; }
          .toast{ max-width:none; }

          .filters{ grid-template-columns:1fr; }
          .segmented{ width:100%; }
          .segmented button{ flex:1; }

          .scroll-x{ -webkit-overflow-scrolling:touch; }
          .board .board-cell{ min-width:112px; }
        }
        @media (max-width:400px){
          .periods-grid{ grid-template-columns:repeat(2,1fr); }
          .kpi{ min-width:100%; }
        }
        @media print{ .no-print, header.top, .roles, .toasts, .toolbar{ display:none !important; } .app{ background:#fff; padding:0; } }
